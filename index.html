<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3Droid – Android App & Web App</title>

    <!-- Correct manifest path for GitHub Pages project site -->
    <link rel="manifest" href="/3Droid/manifest.json">

    <!-- Theme colors for PWA -->
    <meta name="theme-color" content="#0a84ff">
    <meta name="background-color" content="#ffffff">

    <!-- Icons -->
    <link rel="icon" href="/3Droid/icons/3droid-192.png">
    <link rel="apple-touch-icon" href="/3Droid/icons/3droid-192.png">

    <!-- Styles -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #0a84ff;
            color: white;
            padding: 25px 10px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .download-btn {
            display: inline-block;
            background: #0a84ff;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 20px;
            text-decoration: none;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .download-btn:hover {
            background: #006fe0;
        }

        .section {
            background: white;
            margin: 20px auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #0a84ff;
            color: white;
        }

        #pwa-status {
            font-weight: bold;
            color: #0a84ff;
        }
    </style>
</head>

<body>

<header>3Droid – Android App & Web App</header>

<div class="container">

    <!-- APK DOWNLOAD SECTION -->
    <div class="section">
        <h2>Download 3Droid APK</h2>
        <p>Works on ALL browsers: Chrome, Edge, Firefox, Samsung Internet, Opera, Safari, Vivo Browser, iQOO Browser, and more.</p>

        <!-- UNIVERSAL APK DOWNLOAD BUTTON -->
        <a class="download-btn"
           href="/3Droid/downloads/3droid.apk"
           download="3droid.apk"
           type="application/vnd.android.package-archive">
            Download APK
        </a>
    </div>

    <!-- PWA INSTALL SECTION -->
    <div class="section">
        <h2>Install 3Droid as a PWA</h2>
        <p id="pwa-status">Checking PWA status…</p>
    </div>

</div>

<footer>
    © 2026 3Droid Project
</footer>

<!-- Service Worker Registration -->
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/3Droid/service-worker.js")
            .then(() => console.log("Service Worker registered"))
            .catch(err => console.error("SW error:", err));
    }

    // PWA Installability Check
    window.addEventListener("load", () => {
        if (window.matchMedia("(display-mode: standalone)").matches) {
            document.getElementById("pwa-status").textContent =
                "3Droid is installed as a PWA.";
        } else {
            document.getElementById("pwa-status").textContent =
                "You can install 3Droid from your browser menu.";
        }
    });
</script>

</body>
</html>
