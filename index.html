<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Droid</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme Color -->
  <meta name="theme-color" content="#1a1a1a">

  <!-- Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.8;
    }

    .download-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      background: #00aaff;
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      border-radius: 10px;
      transition: 0.2s;
    }

    .download-btn:hover {
      background: #0088cc;
    }

    .fallback {
      margin-top: 15px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .fallback a {
      color: #00aaff;
    }
  </style>

  <!-- Auto-download Script -->
  <script>
    window.onload = function() {
      setTimeout(() => {
        window.location.href = "downloads/3droid.apk";
      }, 800);
    };
  </script>
</head>

<body>
  <header>
    <h1>3Droid</h1>
    <p>Your lightweight Android tool — fast, clean, and simple.</p>

    <!-- Main Download Button -->
    <a href="downloads/3droid.apk" class="download-btn">Download APK</a>

    <!-- Fallback Link -->
    <div class="fallback">
      If your file doesn't start, 
      <a href="downloads/fallback.html">Click Here</a>
    </div>
  </header>

  <!-- Register Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
