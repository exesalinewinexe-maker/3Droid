<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>3Droid</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json?v=2">
  <meta name="theme-color" content="#000000">

  <!-- Icons -->
  <link rel="icon" href="/icons/3droid-192.png">
  <link rel="apple-touch-icon" href="/icons/3droid-512.png">

  <!-- Basic SEO -->
  <meta name="description" content="3Droid is an Android emulator for Android.">

  <!-- Styles -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }
    header {
      padding: 40px 20px;
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    section {
      margin-bottom: 40px;
    }
    .playstore-btn {
      display: inline-block;
      text-decoration: none;
    }
    .playstore-img {
      width: 220px;
      height: auto;
      border-radius: 8px;
      background: #fff;
      padding: 6px;
    }
    .playstore-img:hover {
      opacity: 0.85;
    }
    footer {
      padding: 20px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>3Droid</h1>
    <p>An experimental Android emulator for Android.</p>
  </header>

  <main>
    <section>
      <h2>Welcome</h2>
      <p>
        This is the web entry point for the 3Droid PWA.
        You can install it to your home screen and launch it like a normal app.
      </p>
    </section>
